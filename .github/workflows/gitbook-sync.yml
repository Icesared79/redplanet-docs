name: GitBook Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitbook-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Re-import to GitBook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger GitBook re-import
        env:
          GITBOOK_API_TOKEN: ${{ secrets.GITBOOK_API_TOKEN }}
          SPACE_ID: GJoYiXnkjsZCEEh65eHa
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GITBOOK_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://github.com/${{ github.repository }}.git","ref":"refs/heads/main"}' \
            "https://api.gitbook.com/v1/spaces/${SPACE_ID}/git/import"
          echo "Sync request accepted."
